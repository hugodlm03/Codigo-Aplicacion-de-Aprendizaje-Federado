method: random
#metric part is just here for documentation
#not needed as this is random strategy
metric:
  goal: minimize
  name: server_loss
parameters:
  use_wandb: 
    value: True
  dataset:
    value: adidas
  clients:
    value: adidas_28_clients
  clients.n_estimators_client: 
    values: [500,800]
  clients.num_iterations:
    values: [100,500]
  clients.xgb.max_depth: 
    values: [4,8,10]
  clients.CNN.lr:
    min: .00001
    max: 0.001
command:
  - C:/Users/PC/Desktop/Codigo-Aplicacion-de-Aprendizaje-Federado/.venv/Scripts/python.exe
  - -m
  - hfedxgboost.run_hydra  
  - ${args}                  
